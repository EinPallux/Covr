<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="surv-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c0f00"/>
      <stop offset="40%" stop-color="#78350f"/>
      <stop offset="70%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <radialGradient id="surv-sun" cx="30%" cy="35%" r="25%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#surv-sky)"/>
  <rect width="1920" height="1080" fill="url(#surv-sun)"/>
  <!-- Sun disc -->
  <circle cx="576" cy="360" r="90" fill="#fef08a" opacity="0.25"/>
  <!-- Mountain silhouettes -->
  <polygon points="0,900 300,400 600,900" fill="#292524"/>
  <polygon points="200,900 600,350 1000,900" fill="#1c1917"/>
  <polygon points="900,900 1200,420 1500,900" fill="#292524"/>
  <polygon points="1300,900 1600,380 1920,900" fill="#1c1917"/>
  <!-- Ground layers -->
  <rect x="0" y="860" width="1920" height="220" fill="#292524"/>
  <rect x="0" y="840" width="1920" height="30" fill="#57534e"/>
  <rect x="0" y="850" width="1920" height="15" fill="#78716c"/>
  <!-- Grass tufts -->
  <rect x="100" y="825" width="8" height="20" fill="#4d7c0f"/>
  <rect x="300" y="828" width="8" height="17" fill="#4d7c0f"/>
  <rect x="800" y="824" width="8" height="21" fill="#4d7c0f"/>
  <rect x="1400" y="827" width="8" height="18" fill="#4d7c0f"/>
  <rect x="1800" y="825" width="8" height="20" fill="#4d7c0f"/>
  <!-- Title -->
  <text x="960" y="510" font-family="system-ui, sans-serif" font-size="128" font-weight="900" fill="#fffbeb" text-anchor="middle" letter-spacing="6">SURVIVAL WORLD</text>
  <text x="960" y="390" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="16">SURVIVAL</text>
  <text x="960" y="605" font-family="system-ui, sans-serif" font-size="34" font-weight="400" fill="#fde68a" text-anchor="middle" letter-spacing="4">Craft · Build · Survive · Thrive</text>
</svg>
