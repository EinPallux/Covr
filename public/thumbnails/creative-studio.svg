  <!-- Title -->
  <text x="960" y="490" font-family="system-ui, sans-serif" font-size="140" font-weight="900" fill="white" text-anchor="middle" letter-spacing="8">CREATIVE STUDIO</text>
  <text x="960" y="590" font-family="system-ui, sans-serif" font-size="52" font-weight="400" fill="#d8b4fe" text-anchor="middle" letter-spacing="4">Build Without Limits</text>
