  <rect x="1096" y="980" width="274" height="100" fill="#3b82f6" opacity="0.5"/>
  <rect x="1370" y="980" width="275" height="100" fill="#a855f7" opacity="0.5"/>
  <rect x="1645" y="980" width="275" height="100" fill="#ec4899" opacity="0.5"/>
